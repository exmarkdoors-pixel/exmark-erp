services:
  - type: web
    name: exmark-erp-staging
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: STAGE
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: exmark-staging-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: exmark-staging-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_FACTORY_MODE
        value: "false"
      - key: EXMARK_OMIT_HSTS
        value: "false"

databases:
  - name: exmark-staging-db
    plan: free
    region: singapore
    databaseName: exmark_erp
    user: exmark_user
