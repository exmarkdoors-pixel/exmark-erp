name: Build EXMARK ERP iOS App

on:
  workflow_dispatch:
    inputs:
      factory_ip:
        description: 'Factory LAN IP for iOS App Transport Security (default: 192.168.1.3)'
        required: false
        default: '192.168.1.3'
      server_port:
        description: 'Factory ERP Server Port (default: 4000)'
        required: false
        default: '4000'
  push:
    tags:
      - 'v*'
    paths:
      - 'ios/**'
      - 'app/**'
      - 'public/**'
      - 'capacitor.config.ts'

jobs:
  build-ios:
    name: Compile iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Configure Factory Endpoint & Sync iOS
        env:
          ERP_PORT: ${{ github.event.inputs.server_port || '4000' }}
        run: |
          echo "Syncing Capacitor iOS workspace..."
          npx tsx scripts/build-ios.ts

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Xcode Archive
        run: |
          mkdir -p dist
          xcodebuild clean archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath dist/EXMARK-ERP.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned / Ad-Hoc IPA
        run: |
          mkdir -p dist/Payload
          cp -r dist/EXMARK-ERP.xcarchive/Products/Applications/App.app dist/Payload/
          cd dist
          zip -r EXMARK-ERP-iOS-v1.2.0.ipa Payload/
          rm -rf Payload/
          ls -lh EXMARK-ERP-iOS-v1.2.0.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EXMARK-ERP-iOS-Build
          path: dist/EXMARK-ERP-iOS-v1.2.0.ipa
          retention-days: 14
