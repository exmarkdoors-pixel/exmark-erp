appId: com.exmark.erp
productName: EXMARK ERP
copyright: Copyright © 2026 EXMARK DOORS PRIVATE LIMITED
compression: normal
npmRebuild: false
nodeGypRebuild: false
asar: true
directories:
  output: dist
files:
  - package.json
  - electron/**/*
  - public/icons/**/*
  - "!node_modules/**/*"
  - "!electron-staging/**/*"
  - "!dist/**/*"
  - "!.next/**/*"
  - "!data/**/*"
  - "!backups/**/*"
extraResources:
  - from: electron-staging/standalone
    to: standalone
    filter:
      - "**/*"
  - from: electron-staging/standalone/node_modules
    to: standalone/node_modules
    filter:
      - "**/*"
  - from: electron-staging/seed-data
    to: seed-data
    filter:
      - "**/*"
  - from: electron-staging/runtime
    to: runtime
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/icons/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EXMARK ERP
portable:
  artifactName: "${productName} ${version}.${ext}"
